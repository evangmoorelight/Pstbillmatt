<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pastor Billmatt Digital Library</title>
<meta name="description" content="Listen to and download Pastor Billmatt's sermons for free.">
<meta name="theme-color" content="#053065">
<link rel="icon" href="logo.jpg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--navy:#053065;--blue:#1659c9;--link:#1659c9;--sky:#e8f0fc;--white:#fff;--ink:#0c2247;--mute:#5d6f90;--line:#d5e1f5;--pbg:#053065;--pbd:transparent}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--blue:#2b64d6;--link:#8bb6ff;--sky:#14223f;--white:#0a1428;--ink:#e8eefb;--mute:#9fb0d2;--line:#1f3157;--pbg:#0f2a57;--pbd:rgba(255,255,255,.14)}}
:root[data-theme=dark]{--blue:#2b64d6;--link:#8bb6ff;--sky:#14223f;--white:#0a1428;--ink:#e8eefb;--mute:#9fb0d2;--line:#1f3157;--pbg:#0f2a57;--pbd:rgba(255,255,255,.14)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--white);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(var(--dock,76px) + 200px)}
button{font:inherit;cursor:pointer;color:inherit}.wrap{max-width:760px;margin:0 auto}
header{background:var(--navy);color:#fff;text-align:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 56px;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:34px;background:var(--white);border-radius:34px 34px 0 0}
.logo{width:min(300px,72vw);height:auto;display:block;margin:0 auto}header p{margin:0 auto;max-width:28em;color:#cfdcf5}
#notify{margin:16px auto 0;background:#fff;color:var(--navy);border:0;border-radius:999px;padding:9px 18px;font-weight:700;font-size:.92rem}#notify[hidden]{display:none}
.themebtn{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:.85rem}
.sw{position:relative;flex:1;min-width:0}.sw input{width:100%;padding-right:40px}
#clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:transparent;color:var(--mute);font-size:1rem}#clear[hidden]{display:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:url(watermark.png) center 58%/min(78vw,520px) no-repeat;opacity:.09}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) body::before{opacity:.16;filter:brightness(1.8)}}:root[data-theme=dark] body::before{opacity:.16;filter:brightness(1.8)}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--white);border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px))}
#dock .in{display:flex;gap:6px;max-width:560px;margin:0 auto}.qb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--mute);font-size:.72rem;font-weight:600;padding:5px 0;border-radius:14px}.qb .ic{display:grid;place-items:center;width:52px;height:30px;border-radius:15px}.qb:active .ic,.qb:hover .ic{background:var(--sky);color:var(--link)}
.foldbtn{display:flex;align-items:center;gap:3px;background:var(--sky);color:var(--link);border:0;border-radius:999px;padding:8px 12px 8px 8px;font-weight:700;font-size:.82rem}.foldbtn svg.i{width:18px;height:18px}main.fold{display:none}
dialog{border:0;border-radius:22px;padding:0;width:min(560px,calc(100vw - 24px));max-height:86vh;background:var(--white);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.4)}dialog::backdrop{background:rgba(5,20,50,.62)}
.sh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}.sh h2{margin:0;font-size:1.1rem}.sh button{border:0;background:var(--sky);width:34px;height:34px;border-radius:50%;color:var(--ink)}
.sb{padding:16px 18px 20px;overflow:auto;max-height:calc(86vh - 66px)}.pbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px 16px;border-radius:14px;background:var(--blue);color:#fff;text-decoration:none;font-weight:700;border:0;margin-top:10px}
.abt{display:block;width:150px;height:150px;border-radius:24px;margin:0 auto 14px;object-fit:cover}.sb p{font-size:1.02rem;line-height:1.65;margin:0 0 12px}.cf{display:grid;gap:10px;margin-bottom:6px}
.cf input,.cf textarea,.pl-input{font:inherit;padding:11px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--sky);color:var(--ink);width:100%;resize:vertical}
.cm{padding:12px 0;border-top:1px solid var(--line)}.cm p{margin:4px 0 0;font-size:.98rem}.cm small,.note{color:var(--mute)}.note{font-size:.85rem}
#banner{display:none;background:var(--blue);color:#fff;padding:12px 20px}#banner.show{display:block}#banner .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between}#banner button{background:#fff;color:var(--blue);border:0;border-radius:8px;padding:7px 14px;font-weight:700}
.tools{position:sticky;top:0;z-index:5;background:var(--white);padding:10px 20px 12px;border-bottom:1px solid var(--line)}.tools .wrap{display:flex;gap:10px;align-items:center}
input[type=search]{-webkit-appearance:none;appearance:none;font:inherit;padding:11px 16px;border:1.5px solid var(--line);border-radius:999px;background:var(--sky);color:var(--ink)}
#count{color:var(--mute);font-size:.85rem;white-space:nowrap}main{padding:6px 20px}
.menubtn{position:relative;flex:none;width:46px;height:46px;border-radius:16px;border:1px solid var(--line);background:var(--white);color:var(--link);display:grid;place-items:center;box-shadow:0 3px 10px rgba(5,48,101,.08);transition:transform .18s,background .18s,box-shadow .18s}.menubtn:active{transform:scale(.94);background:var(--sky);box-shadow:none}.menubtn svg.i{width:23px;height:23px;stroke-width:2.2}.menubtn .dot{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:#e5484d;border:2px solid var(--sky)}.menubtn .dot[hidden]{display:none}
.tools .fbar{margin-top:10px}.fbar[hidden]{display:none!important}.fp{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:6px 8px 6px 12px;font-weight:700;font-size:.85rem}.fp svg.i{width:16px;height:16px}.fp b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.25);font-size:.7rem}
#scrim{position:fixed;inset:0;z-index:19;background:rgba(3,12,32,.48);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;visibility:hidden;transition:opacity .28s ease,visibility .28s}#scrim.open{opacity:1;visibility:visible}
#drawer{position:fixed;top:max(8px,env(safe-area-inset-top,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));left:8px;z-index:20;width:min(86vw,350px);background:var(--white);color:var(--ink);display:flex;flex-direction:column;border:1px solid rgba(120,155,210,.18);border-radius:28px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.32),0 4px 16px rgba(0,0,0,.12);transform:translate3d(calc(-100% - 24px),0,0) scale(.97);transform-origin:left center;visibility:hidden;transition:transform .38s cubic-bezier(.2,.85,.25,1),visibility .38s;padding-bottom:env(safe-area-inset-bottom,0px);will-change:transform}#drawer.open{transform:translate3d(0,0,0) scale(1);visibility:visible}
.dh{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(135deg,#073b8e 0%,#0878e8 58%,#39a5ff 100%);color:#fff;display:flex;align-items:center;gap:12px;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 22px 18px;min-height:104px}.dh:after{content:"";position:absolute;z-index:-1;width:150px;height:150px;border-radius:50%;right:-46px;top:-76px;background:rgba(255,255,255,.12);box-shadow:-35px 72px 0 -18px rgba(255,255,255,.08)}.dh img{width:48px;height:48px;border:2px solid rgba(255,255,255,.7);box-shadow:0 5px 16px rgba(0,0,0,.2);border-radius:15px;object-fit:cover;background:#0a3f85}.dh div{flex:1;min-width:0}.dh b{display:block;font-size:1.05rem;letter-spacing:-.02em}.dh small{display:block;color:#e1edff;font-size:.78rem;margin-top:3px}.dh button{display:grid;place-items:center;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.15);color:#fff;width:36px;height:36px;border-radius:12px;font-size:1rem;backdrop-filter:blur(8px);transition:background .18s,transform .18s}.dh button:active{transform:scale(.92);background:rgba(255,255,255,.28)}
#dlist{flex:1;overflow-y:auto;padding:14px 12px 18px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}.dlab{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:6px 10px 8px}
.di{display:flex;align-items:center;gap:12px;width:100%;border:1px solid transparent;background:transparent;text-align:left;padding:9px 10px;border-radius:16px;font-weight:650;font-size:.96rem;margin-bottom:4px;color:var(--ink);transition:background .2s,border-color .2s,transform .2s;animation:drawerItemIn .34s both;animation-delay:calc(var(--item-index,0)*28ms)}.di .bx{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--sky);color:var(--link);flex:none;box-shadow:inset 0 0 0 1px rgba(90,140,210,.08);transition:background .2s,color .2s,transform .2s}.di .bx svg.i{width:21px;height:21px;stroke-width:1.9}.di span.n{flex:1;min-width:0}.di small{color:var(--mute);font-weight:750;font-size:.76rem;background:var(--sky);border-radius:999px;padding:3px 9px}.di:active{background:var(--sky);transform:scale(.985)}.di.on{background:linear-gradient(105deg,#0878e8,#1764cc);border-color:rgba(255,255,255,.15);color:#fff;box-shadow:0 6px 16px rgba(8,120,232,.2)}.di.on .bx{background:rgba(255,255,255,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}.di.on small{background:rgba(255,255,255,.2);color:#fff}.dsep{height:1px;background:var(--line);margin:10px 10px}@keyframes drawerItemIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.tag{display:inline-flex;align-items:center;gap:5px;margin-top:4px;color:var(--link);font-size:.78rem;font-weight:700}.tag svg.i{width:14px;height:14px}
.ep{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.cover{position:relative;flex:none;width:76px;height:76px;border-radius:14px;overflow:hidden;border:0;padding:0;background:var(--navy)}.cover img{width:100%;height:100%;object-fit:cover;display:block}.cover span{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,48,101,.35);color:#fff;font-size:1.5rem}.ep.on .cover{outline:3px solid var(--link);outline-offset:2px}
.body{min-width:0;flex:1}.t{font-weight:700;font-size:1.02rem;line-height:1.3;margin:0}.ep.on .t{color:var(--link)}.new{display:inline-block;background:var(--blue);color:#fff;font-size:.7rem;font-weight:700;border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:1px}.m{color:var(--mute);font-size:.85rem;margin-top:2px}.dl{margin-top:8px;background:var(--sky);color:var(--link);border:0;border-radius:8px;padding:7px 12px;font-weight:700;font-size:.82rem;margin-right:5px}.dl:disabled{opacity:.6}.msg{padding:40px 0;text-align:center;color:var(--mute)}.msg button{margin-top:12px;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:700}footer{text-align:center;color:var(--mute);font-size:.8rem;padding:24px 20px}
.pl-head{background:var(--sky);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0 4px}.pl-head h2{margin:0 0 3px;font-size:1.15rem}.pl-head p{margin:0 0 10px;color:var(--mute);font-size:.86rem}.pl-actions{display:flex;gap:8px;flex-wrap:wrap}.pl-actions button{border:0;border-radius:999px;background:var(--blue);color:#fff;font-weight:700;padding:8px 13px;font-size:.84rem}.pl-actions .secondary{background:var(--white);color:var(--link);border:1px solid var(--line)}
.playlist-actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.playlist-actions .dl{margin-top:0;padding:6px 9px}.pl-manage-row{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}.pl-manage-row .pl-name{flex:1;min-width:0}.pl-manage-row b{display:block;overflow-wrap:anywhere}.pl-manage-row small{color:var(--mute)}.pl-manage-row button{border:0;border-radius:9px;background:var(--sky);color:var(--link);padding:8px 10px;font-weight:700}
#player{position:fixed;left:12px;right:12px;bottom:calc(var(--dock,76px) + 10px);max-width:736px;margin:0 auto;background:var(--pbg);border:1px solid var(--pbd);color:#fff;border-radius:22px;padding:14px 16px 12px;box-shadow:0 10px 30px rgba(5,48,101,.45);transform:translateY(160%);transition:transform .25s;z-index:10}#player.show{transform:none}#player.min{padding:10px 12px}#player.min .seek,#player.min .ctl{display:none}#player.min #pcover{width:40px;height:40px;border-radius:10px}#mpp{display:none;opacity:1}#player.min #mpp{display:block}#mbar{display:none;height:3px;background:rgba(255,255,255,.25);border-radius:2px;margin-top:8px;overflow:hidden}#mbar i{display:block;height:100%;width:0;background:#fff}#player.min #mbar{display:block}
.pt{display:flex;gap:12px;align-items:center}#pcover{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none;background:#0a3f85}#now{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pt .x{flex:none;background:transparent;border:0;font-size:1.3rem;opacity:.75;padding:4px 8px}
.seek{display:flex;gap:10px;align-items:center;margin:10px 0 4px;font-size:.78rem;color:#bcd0f2}.seek span{min-width:38px;text-align:center}input[type=range]{flex:1;accent-color:#fff;height:22px;margin:0}.ctl{display:flex;justify-content:center;align-items:center;gap:14px}.ctl button{background:transparent;border:0;padding:6px 10px;font-size:.88rem;font-weight:600;color:#dbe7fb;border-radius:10px}#pp{width:54px;height:54px;border-radius:50%;background:#fff;color:var(--navy);font-size:1.2rem;padding:0}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}#player :focus-visible{outline-color:#fff}@media(prefers-reduced-motion:reduce){#player,#drawer,#scrim,.di{transition:none;animation:none}}

/* Modern multicolor icon system */
.menubtn{color:#2479f2;background:linear-gradient(145deg,var(--white),var(--sky));border-color:rgba(36,121,242,.22)}
.themebtn{background:linear-gradient(135deg,#7c3aed,#2563eb);border-color:rgba(255,255,255,.32);box-shadow:0 5px 18px rgba(37,99,235,.24)}
.di .bx{background:color-mix(in srgb,currentColor 12%,var(--white));box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 18%,transparent),0 3px 8px rgba(12,34,71,.04)}
.di[data-cat="all"] .bx{color:#2479f2;background:rgba(36,121,242,.12)}
.di[data-cat="faith"] .bx{color:#10a66a;background:rgba(16,166,106,.12)}
.di[data-cat="prayer"] .bx{color:#9b5de5;background:rgba(155,93,229,.13)}
.di[data-cat="healing"] .bx{color:#06a6c7;background:rgba(6,166,199,.13)}
.di[data-cat="family"] .bx{color:#e64980;background:rgba(230,73,128,.13)}
.di[data-cat="money"] .bx{color:#e58a10;background:rgba(229,138,16,.14)}
.di[data-cat="purpose"] .bx{color:#3978ef;background:rgba(57,120,239,.13)}
.di[data-cat="spirit"] .bx{color:#8758e8;background:rgba(135,88,232,.13)}
.di[data-cat="grace"] .bx{color:#13a88a;background:rgba(19,168,138,.13)}
.di[data-cat="victory"] .bx{color:#e24b4b;background:rgba(226,75,75,.13)}
