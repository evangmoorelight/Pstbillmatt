<body>
<header><button class="themebtn" id="themebtn" aria-label="Switch between light and dark mode"></button><div class="wrap"><img class="logo" src="logo.jpg" alt="Pastor Billmatt Digital Library"><p>Listen to sermons here, or download them to your phone to hear later. Free for everyone.</p><button id="notify" hidden>Notify me of new sermons</button></div></header>

{id:"faith",name:"Faith",icon:"sprout",k:"faith|believ|trust|obedien|obey|patien|surrender|walk(?:ing)? with|doubt"},
{id:"prayer",name:"Prayer & Worship",icon:"flame",k:"pray|intercess|fast(?:ing)?\\b|worship|altar|praise|supplicat|devotion"},

/* RSS feed */
function parse(xml){
  const doc=new DOMParser().parseFromString(xml,"text/xml");if(doc.querySelector("parsererror"))throw new Error("bad xml");
  const chArt=(()=>{const n=[...doc.querySelectorAll("channel > *")].find(x=>x.nodeName==="itunes:image");return n?n.getAttribute("href"):""})();
  return [...doc.querySelectorAll("item")].map(it=>{
    const enc=it.querySelector("enclosure"),g=t=>{const n=[...it.children].find(x=>x.nodeName===t);return n?n.textContent.trim():""};
    const im=[...it.children].find(x=>x.nodeName==="itunes:image"),d=document.createElement("div");d.innerHTML=g("description");
    return{id:g("guid")||(enc&&enc.getAttribute("url")),title:g("title"),url:enc?enc.getAttribute("url"):"",date:new Date(g("pubDate")),dur:g("itunes:duration"),desc:(d.textContent||"").trim(),img:(im&&im.getAttribute("href"))||chArt||LOGO};
  }).filter(e=>e.url&&e.id);
}
async function fetchFeed(){for(const p of PROXIES){try{const r=await fetch(p(FEED),{cache:"no-store"});if(!r.ok)continue;const t=await r.text();if(t.includes("<item"))return t}catch(e){}}return null}
function checkNew(list,first){
  const ids=list.map(e=>e.id);if(seen===null){seen=ids;store.set("seen",JSON.stringify(ids));return}
  const fresh=list.filter(e=>!seen.includes(e.id));if(!fresh.length)return;
  fresh.forEach(e=>newIds.add(e.id));$("bannerText").textContent=fresh.length===1?"New sermon: "+fresh[0].title:fresh.length+" new sermons added";$("banner").classList.add("show");
  $("bannerBtn").onclick=()=>{$("banner").classList.remove("show");play(eps.findIndex(x=>x.id===fresh[0].id))};
  if(!first)notify(fresh[0].title,fresh.length);seen=ids;store.set("seen",JSON.stringify(ids));
}
async function notify(title,n){if(!("Notification"in window)||Notification.permission!=="granted")return;const head=n>1?n+" new sermons":"New sermon",o={body:title,icon:"icon-192.png"};try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg)await reg.showNotification(head,o);else new Notification(head,o)}catch(e){}}
function setupNotifyButton(){const b=$("notify");if(!("Notification"in window)||Notification.permission!=="default")return;b.hidden=false;b.onclick=async()=>{const r=await Notification.requestPermission();b.hidden=true;if(r==="granted")notify("You will be told when a new sermon is added.",1)}}
async function load(first){
  if(first)$("list").innerHTML='<div class="msg">Loading sermons…</div>';
  const xml=await fetchFeed();let list=[];
  try{if(xml){list=parse(xml);store.set("feed",xml)}else if(first){const c=store.get("feed");if(c)list=parse(c)}}catch(e){}
  if(!list.length){if(first&&!eps.length){$("list").innerHTML='<div class="msg">Sermons could not be loaded. Check your internet connection and try again.<br><button id="retry">Try again</button></div>';$("retry").onclick=()=>load(true);$("count").textContent=""}return}
  const changed=!eps.length||list[0].id!==eps[0].id||list.length!==eps.length,playingId=cur>-1?eps[cur].id:null;
  list.forEach(e=>e.cat=categorize(e));eps=list;cur=playingId?eps.findIndex(e=>e.id===playingId):-1;
  checkNew(eps,first);if(changed){drawCats();render()}
}

/* Audio player */
const mmss=s=>{if(!isFinite(s))return"0:00";s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,"0");return h?h+":"+String(m).padStart(2,"0")+":"+x:m+":"+x};
function play(i){

  if(playlistQueueActive){const pos=playlistQueue.indexOf(eps[i].id);if(pos>=0)playlistQueuePosition=pos;else{playlistQueueActive=false;playlistQueue=[];playlistQueuePosition=-1}}
  if(i===cur){if(a.paused)a.play().catch(()=>{});else a.pause();return}
  cur=i;const e=eps[i];a.src=e.url;a.play().catch(()=>{});
  $("now").textContent=e.title;$("pcover").src=e.img;$("pcover").onerror=()=>{$("pcover").src=LOGO};$("player").classList.add("show");
  if("mediaSession"in navigator&&"MediaMetadata"in window){
    const ms=navigator.mediaSession;ms.metadata=new MediaMetadata({title:e.title,artist:"Pastor Billmatt",album:"Pastor Billmatt Digital Library",artwork:[{src:e.img,sizes:"512x512"},{src:"icon-512.png",sizes:"512x512",type:"image/png"}]});
    const set=(n,f)=>{try{ms.setActionHandler(n,f)}catch(x){}};
    set("play",()=>a.play());set("pause",()=>a.pause());set("seekbackward",()=>{a.currentTime=Math.max(0,a.currentTime-15)});set("seekforward",()=>{a.currentTime=Math.min(a.duration||1e9,a.currentTime+15)});set("seekto",d=>{if(d.seekTime!=null)a.currentTime=d.seekTime});
    set("previoustrack",()=>{if(playlistQueueActive&&playlistQueuePosition>0){playlistQueuePosition--;play(eps.findIndex(e=>e.id===playlistQueue[playlistQueuePosition]))}else if(cur>0)play(cur-1)});
    set("nexttrack",()=>nextTrack());
  }
  render();

function nextTrack(){
  if(playlistQueueActive){
    if(playlistQueuePosition<playlistQueue.length-1){playlistQueuePosition++;const idx=eps.findIndex(e=>e.id===playlistQueue[playlistQueuePosition]);if(idx>=0){play(idx);return}}

  }
  if(cur<eps.length-1)play(cur+1);
}
function sync(){const p=!a.paused;for(const id of ["pp","mpp"]){$(id).textContent=p?"❚❚":"▶";$(id).setAttribute("aria-label",p?"Pause":"Play")}if("mediaSession"in navigator)navigator.mediaSession.playbackState=p?"playing":"paused";render()}

$("pp").onclick=$("mpp").onclick=()=>a.paused?a.play().catch(()=>{}):a.pause();$("back").onclick=()=>a.currentTime=Math.max(0,a.currentTime-15);$("fwd").onclick=()=>a.currentTime=Math.min(a.duration||1e9,a.currentTime+15);

/* Downloads */
const safe=s=>s.replace(/[\\/:*?"<>|]+/g," ").trim().slice(0,80)||"sermon";
async function download(e,btn){const old=btn.textContent;btn.disabled=true;btn.textContent="Downloading…";try{const r=await fetch(e.url);if(!r.ok)throw 0;const b=await r.blob(),l=document.createElement("a");l.href=URL.createObjectURL(b);l.download=safe(e.title)+".mp3";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(l.href),4000);btn.textContent="Saved"}catch(err){window.open(e.url,"_blank","noopener");btn.textContent="Opened in new tab"}setTimeout(()=>{btn.textContent=old;btn.disabled=false},3000)}

/* Theme */
const root=document.documentElement,meta=document.querySelector('meta[name=theme-color]'),isDark=()=>root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
function paintTheme(){$("themebtn").textContent=isDark()?"☀ Light":"☾ Dark";meta.content=isDark()?"#0a1428":"#053065"}
{const t=store.get("theme");if(t)root.dataset.theme=t}
$("themebtn").onclick=()=>{root.dataset.theme=isDark()?"light":"dark";store.set("theme",root.dataset.theme);paintTheme()};
if(matchMedia("(prefers-color-scheme:dark)").addEventListener)matchMedia("(prefers-color-scheme:dark)").addEventListener("change",paintTheme);
paintTheme();$("clear").onclick=()=>{$("q").value="";render();$("q").focus()};

/* Icons and bottom sheets */
const P={
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',chat:'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',heart:'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',speaker:'<path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/>',send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',chevD:'<path d="m6 9 6 6 6-6"/>',chevU:'<path d="m18 15-6-6-6 6"/>',mail:'<rect width="20" height="14" x="2" y="5" rx="2"/><path d="m22 7-10 7L2 7"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="2.2"/><rect x="14" y="3" width="7" height="7" rx="2.2"/><rect x="3" y="14" width="7" height="7" rx="2.2"/><rect x="14" y="14" width="7" height="7" rx="2.2"/>',sprout:'<path d="M7 21h10M12 21V11"/><path d="M12 11c0-4 3-6 8-6 0 4-3 6-8 6Z"/><path d="M12 14c0-3-2-5-7-5 0 3 2 5 7 5Z"/>',flame:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5Z"/>',pulse:'<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/><path d="M3.2 12h6.3l.5-1 2 4.5 2-7 1.5 3.5h5.3"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/>',coins:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M15 9.5c-.5-1-1.5-1.5-3-1.5s-3 .8-3 2 1.2 1.7 3 2 3 .8 3 2-1.5 2-3 2-2.5-.5-3-1.5"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',bolt:'<path d="M13 2 3 14h9l-1 8 10-12h-9Z"/>',gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/>',book:'<path d="M2 4h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2Z"/><path d="M22 4h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7Z"/>',dots:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',plus:'<path d="M12 5v14M5 12h14"/>',playlist:'<path d="M4 6h10M4 11h10M4 16h6" stroke-linecap="round"/><circle cx="18" cy="16" r="4"/><path d="M18 14v4m-2-2h4" stroke-linecap="round"/>',settings:'<circle cx="12" cy="12" r="3.2"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8 8 0 0 1-1.6.9l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.6-.9l-1.7.6-1.4-2.4 1.4-1.1a7 7 0 0 1 0-1.9l-1.4-1.1 1.4-2.4 1.7.6a8 8 0 0 1 1.6-.9l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.6.9l1.7-.6 1.4 2.4-1.4 1.1a7 7 0 0 1 0 1.9Z"/>'
};
const svg=n=>'<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+(P[n]||P.dots)+'</svg>';
$("menuIc").innerHTML=svg("menu");document.querySelector("#qAbout .ic").innerHTML=svg("user");document.querySelector("#qComm .ic").innerHTML=svg("chat");document.querySelector("#qPart .ic").innerHTML=svg("heart");
const pl=$("player");
function setMin(v){pl.classList.toggle("min",v);store.set("pmin",v?"1":"0");$("mini").innerHTML=svg(v?"chevU":"chevD");$("mini").setAttribute("aria-label",v?"Expand player":"Minimize player")}
$("mini").onclick=()=>setMin(!pl.classList.contains("min"));$("now").onclick=$("pcover").onclick=()=>{if(pl.classList.contains("min"))setMin(false)};setMin(store.get("pmin")==="1");
function setFold(f){$("main").classList.toggle("fold",f);$("fold").innerHTML=svg(f?"chevD":"chevU")+"<span>"+(f?"Show":"Hide")+"</span>";$("fold").setAttribute("aria-expanded",String(!f));$("fold").setAttribute("aria-label",f?"Show sermons":"Hide sermons")}
$("fold").onclick=()=>setFold(!$("main").classList.contains("fold"));$("q").addEventListener("input",()=>{if($("q").value&&$("main").classList.contains("fold"))setFold(false)});setFold(false);
const setDock=()=>root.style.setProperty("--dock",$("dock").offsetHeight+"px");setDock();addEventListener("resize",setDock);
if("serviceWorker"in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
const sheet=$("sheet");
function openSheet(title,build){$("shT").textContent=title;const b=$("shB");b.innerHTML="";build(b);if(!sheet.open)sheet.showModal()}
const stopSpeech=()=>{if("speechSynthesis"in window)speechSynthesis.cancel()};$("shX").onclick=()=>sheet.close();sheet.addEventListener("close",stopSpeech);sheet.addEventListener("click",e=>{if(e.target===sheet)sheet.close()});
const btn=(cls,icon,label,href)=>{const el=document.createElement(href?"a":"button");el.className=cls;el.innerHTML=svg(icon)+"<span></span>";el.lastChild.textContent=label;if(href){el.href=href;el.target="_blank";el.rel="noopener"}return el};
$("qAbout").onclick=()=>openSheet("Pastor Billmatt Osale",b=>{const im=document.createElement("img");im.src=LOGO;im.alt="";im.className="abt";b.appendChild(im);const p=document.createElement("p");p.textContent=ABOUT;b.appendChild(p);if("speechSynthesis"in window){const r=btn("pbtn","speaker","Read aloud");r.onclick=()=>{if(speechSynthesis.speaking){stopSpeech();r.lastChild.textContent="Read aloud";return}const u=new SpeechSynthesisUtterance(ABOUT);u.onend=()=>r.lastChild.textContent="Read aloud";speechSynthesis.speak(u);r.lastChild.textContent="Stop reading"};b.appendChild(r)}});
let disqusLoaded=false;
function drawComments(){const l=$("cl");l.innerHTML="";let arr=[];try{arr=JSON.parse(store.get("comments")||"[]")}catch(e){}if(!arr.length){l.innerHTML='<p class="note">No comments yet. Be the first to share.</p>';return}arr.slice().reverse().forEach(c=>{const d=document.createElement("div");d.className="cm";const h=document.createElement("b");h.textContent=c.n;const t=document.createElement("small");t.textContent=" · "+new Date(c.t).toLocaleDateString();const p=document.createElement("p");p.textContent=c.x;d.append(h,t,p);l.appendChild(d)})}
$("qComm").onclick=()=>openSheet("Comments",b=>{
  if(DISQUS_SHORTNAME){b.innerHTML='<div id="disqus_thread"></div>';const cfg=function(){this.page.url=location.href.split("#")[0];this.page.identifier="pastor-billmatt-library"};if(window.DISQUS&&disqusLoaded)DISQUS.reset({reload:true,config:cfg});else{window.disqus_config=cfg;const s=document.createElement("script");s.src="https://"+DISQUS_SHORTNAME+".disqus.com/embed.js";s.setAttribute("data-timestamp",+new Date());document.head.appendChild(s);disqusLoaded=true}return}
  b.innerHTML='<form id="cf" class="cf"><input id="cn" maxlength="40" placeholder="Your name" aria-label="Your name" required><textarea id="ct" maxlength="500" rows="3" placeholder="Share a comment or testimony" aria-label="Comment" required></textarea><button class="pbtn" type="submit" style="margin-top:0"></button></form><p class="note">Comments are saved on this device.</p><div id="cl"></div>';const post=document.querySelector("#cf .pbtn");post.innerHTML=svg("send")+"<span>Post comment</span>";
  $("cf").onsubmit=e=>{e.preventDefault();let arr=[];try{arr=JSON.parse(store.get("comments")||"[]")}catch(x){}arr.push({n:$("cn").value.trim(),x:$("ct").value.trim(),t:Date.now()});store.set("comments",JSON.stringify(arr.slice(-100)));$("ct").value="";drawComments()};drawComments();
});
$("qPart").onclick=()=>openSheet("Partner with us",b=>{const p=document.createElement("p");p.textContent=PARTNER.text;b.appendChild(p);if(PARTNER.give)b.appendChild(btn("pbtn","heart","Give or partner online",PARTNER.give));if(PARTNER.whatsapp)b.appendChild(btn("pbtn","chat","WhatsApp "+PARTNER.whatsappNumber,PARTNER.whatsapp));if(PARTNER.email)b.appendChild(btn("pbtn","mail","Send an email","mailto:"+PARTNER.email))});
try{seen=JSON.parse(store.get("seen")||"null")}catch(e){seen=null}
loadPlaylists();$("q").addEventListener("input",render);setupNotifyButton();load(true);setInterval(()=>load(false),10*60*1000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)load(false)});
</script>
